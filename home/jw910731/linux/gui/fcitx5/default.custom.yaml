patch:
  schema_list:
    - schema: double_pinyin_flypy
    - schema: bopomofo_tw
  # 以 /+ 追加（__patch 清單中的 map 會被當成路徑補靪操作而非列表項目，無法用於此）
  key_binder/bindings/+:
    # 1. 選字選單中按 Enter 選中當前高亮的候選字（等同按空白鍵）
    - { when: has_menu, accept: Return, send: space }
    # 2. 用左右方括號移動輸入遊標（取代左右方向鍵）
    - { when: composing, accept: bracketleft, send: Left }
    - { when: composing, accept: bracketright, send: Right }
    # 3. 左右方向鍵改為翻頁
    - { when: paging, accept: Left, send: Page_Up }
    - { when: has_menu, accept: Right, send: Page_Down }